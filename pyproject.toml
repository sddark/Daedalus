[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-workbench"
version = "0.1.0"
description = "Headless STEP assembly movement proof for a Git-backed engineering workbench"
requires-python = ">=3.11,<3.13"
dependencies = ["cadquery-ocp==7.8.1.1.post1"]

[project.scripts]
engineering-workbench = "engineering_workbench.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
