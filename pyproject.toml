[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-workbench"
version = "0.1.0"
description = "Daedalus local STEP component viewer, movement diff, and round-trip proof"
requires-python = ">=3.11,<3.13"
dependencies = ["cadquery-ocp-novtk==8.0.1.1.0"]

[project.scripts]
engineering-workbench = "engineering_workbench.__main__:main"
daedalus = "engineering_workbench.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
engineering_workbench = ["static/*", "static/vendor/*"]
